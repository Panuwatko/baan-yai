<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d0f">
<meta name="description" content="เกมเลือกทางขับรถกลางคืน 420 กม. ไปบ้านยายให้ถึงก่อนเช้า">
<title>ทางกลับบ้านยาย</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="บ้านยาย">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Mono:wght@500&family=Sarabun:wght@400;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<div class="app">
  <header class="hud" id="hud" hidden>
    <div class="hud-top">
      <div class="road"><span>กรุงเทพฯ</span><div class="track"><div class="car" id="car"></div></div><span>บ้านยาย</span></div>
    </div>
    <div class="stats">
      <div class="stat"><span class="lbl">สติ</span><div class="bar"><i id="sanBar"></i></div><b id="sanVal"></b></div>
      <div class="stat"><span class="lbl">น้ำมัน</span><div class="bar"><i id="fuelBar"></i></div><b id="fuelVal"></b></div>
    </div>
    <div class="meta"><span class="clock" id="clock"></span><span id="km"></span></div>
    <div class="bag" id="bag"></div>
  </header>
  <main class="scene" id="scene" aria-live="polite"></main>
</div>
<div class="shade" aria-hidden="true"></div>
<noscript><p style="color:#d6dbcf;padding:24px">เกมนี้ต้องเปิด JavaScript</p></noscript>
</body>
</html>
